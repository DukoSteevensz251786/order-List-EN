<style>
:root{--navy:#14294B;--blue:#2E5496;--blue2:#3D6BC4;--amber:#E8850C;--amber-d:#C4700A;--bg:#EAEEF3;--card:#fff;--ink:#182233;--muted:#6A7788;--line:#DCE3EC;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--sans);background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 60%,var(--blue2) 100%);color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{max-width:520px;text-align:center}
.mark{width:64px;height:64px;border-radius:14px;background:var(--amber);display:grid;place-items:center;font-weight:800;color:var(--navy);font-size:26px;letter-spacing:-1px;margin:0 auto 18px}
h1{font-size:24px;font-weight:800;margin:0 0 6px}
.sub{font-size:14px;color:#C6D4EC;line-height:1.5;margin:0 0 26px}
.choices{display:grid;gap:12px}
a.btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:var(--navy);text-decoration:none;font-weight:800;font-size:16px;padding:16px 20px;border-radius:12px;border-top:3px solid var(--amber);transition:.14s}
a.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.25)}
a.btn .flag{font-size:20px}
.redir{font-size:12.5px;color:#9FB2D4;margin-top:22px;min-height:18px}
.foot{font-size:12px;color:#8195B8;margin-top:16px}
</style>
</head>
<body>
<main class="wrap">
  <div class="mark">VV</div>
  <h1>Van Vliet Automotive</h1>
  <p class="sub">Genuine OE surplus truck parts — MAN, VW, Iveco, Mercedes-Benz, Toyota.<br>Peças genuínas OE de caminhão excedentes.</p>
  <div class="choices">
    <a class="btn" href="/catalog-en/"><span class="flag">&#127468;&#127463;</span> Enter catalogue (English)</a>
    <a class="btn" href="/catalog-pt/"><span class="flag">&#127463;&#127479;</span> Acessar catálogo (Português)</a>
  </div>
  <p class="redir" id="redir"></p>
  <p class="foot">Nieuwerkerk aan den IJssel, Netherlands • Prices in EUR, ex-works</p>
</main>
<script>
/* Send visitors to their language automatically; the links above always work as a fallback. */
(function(){
  try{
    var lang=(navigator.language||navigator.userLanguage||"en").toLowerCase();
    var target=lang.indexOf("pt")===0 ? "/catalog-pt/" : "/catalog-en/";
    var label=target==="/catalog-pt/" ? "Redirecionando para o catálogo\u2026" : "Redirecting to the catalogue\u2026";
    document.getElementById("redir").textContent=label;
    setTimeout(function(){ window.location.replace(target); }, 900);
  }catch(e){ window.location.replace("/catalog-en/"); }
})();
</script>
</body>
</html>
